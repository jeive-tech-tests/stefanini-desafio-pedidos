server {
    listen 80;
    listen [::]:80;
    server_name jeive.dev www.jeive.dev;

    return 301 https://jeive.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.jeive.dev;

    ssl_certificate /etc/letsencrypt/live/jeive.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jeive.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://jeive.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jeive.dev;

    ssl_certificate /etc/letsencrypt/live/jeive.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jeive.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        return 302 /stefanini-desafio-pedidos/;
    }

    location = /stefanini-desafio-pedidos {
        return 308 /stefanini-desafio-pedidos/;
    }

    location /stefanini-desafio-pedidos/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /stefanini-desafio-pedidos;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
