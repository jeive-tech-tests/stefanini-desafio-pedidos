<app-pedido-list />
<app-ui-modal [visible]="true" [header]="'Editar pedido #' + id" (closed)="cancelar()">
  <p class="mb-6 text-sm text-slate-500 dark:text-blue-200/70">
    Atualize os dados do cliente, os itens e a situação do pagamento.
  </p>
  @if (carregando()) {
    <app-ui-loading label="Carregando formulário..." />
  } @else {
    <app-pedido-form
      [pedido]="pedido()"
      [produtos]="produtos()"
      [salvando]="salvando()"
      (submitted)="salvar($event)"
      (cancelled)="cancelar()"
    />
  }
</app-ui-modal>
