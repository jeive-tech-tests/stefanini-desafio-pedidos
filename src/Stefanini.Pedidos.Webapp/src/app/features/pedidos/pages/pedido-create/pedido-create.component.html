<app-pedido-list />
<app-ui-modal [visible]="true" header="Novo pedido" (closed)="cancelar()">
  <p class="mb-6 text-sm text-slate-500 dark:text-blue-200/70">
    Informe os dados do cliente e selecione os produtos do pedido.
  </p>
  @if (carregando()) {
    <app-loading label="Carregando formulário..." />
  } @else {
    <app-pedido-form
      [produtos]="produtos()"
      [salvando]="salvando()"
      (submitted)="salvar($event)"
      (cancelled)="cancelar()"
    />
  }
</app-ui-modal>
