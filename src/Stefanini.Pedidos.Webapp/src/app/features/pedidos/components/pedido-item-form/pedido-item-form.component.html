<div
  class="grid gap-4 rounded-xl border border-slate-200 bg-slate-50/70 p-4 lg:grid-cols-[minmax(220px,1fr)_130px_120px_140px_44px] lg:items-start dark:border-slate-800 dark:bg-slate-950/40"
  [formGroup]="group"
>
  <label
    ><span class="mb-2 block text-xs font-semibold text-slate-500 lg:hidden">Produto</span
    ><p-select
      class="w-full"
      formControlName="idProduto"
      [options]="produtos"
      optionLabel="nomeProduto"
      optionValue="id"
      placeholder="Selecione um produto"
      appendTo="body"
      [invalid]="group.controls.idProduto.touched && group.controls.idProduto.invalid"
      [attr.aria-label]="'Produto do item ' + (index + 1)"
    />
    @if (group.controls.idProduto.touched && group.controls.idProduto.invalid) {
      <small class="mt-1.5 block text-xs text-red-500">Selecione um produto.</small>
    }
  </label>
  <div>
    <span class="mb-2 block text-xs font-semibold text-slate-500 lg:hidden">Valor unitário</span
    ><span class="flex min-h-10 items-center text-sm">{{
      unitPrice | currency: 'BRL' : 'symbol' : '1.2-2'
    }}</span>
  </div>
  <label
    ><span class="mb-2 block text-xs font-semibold text-slate-500 lg:hidden">Quantidade</span
    ><p-inputnumber
      class="w-full"
      formControlName="quantidade"
      [min]="1"
      [showButtons]="true"
      buttonLayout="horizontal"
      incrementButtonIcon="pi pi-plus"
      decrementButtonIcon="pi pi-minus"
      [invalid]="group.controls.quantidade.touched && group.controls.quantidade.invalid"
      [attr.aria-label]="'Quantidade do item ' + (index + 1)"
  /></label>
  <div class="lg:text-right">
    <span class="mb-2 block text-xs font-semibold text-slate-500 lg:hidden">Subtotal</span
    ><strong
      class="flex min-h-10 items-center font-bold text-slate-950 lg:justify-end dark:text-white"
      >{{ subtotal | currency: 'BRL' : 'symbol' : '1.2-2' }}</strong
    >
  </div>
  <app-ui-button
    severity="danger"
    [text]="true"
    [rounded]="true"
    icon="pi pi-trash"
    (clicked)="remove.emit()"
    [ariaLabel]="'Remover item ' + (index + 1)"
  />
</div>
