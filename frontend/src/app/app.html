<div class="app-shell">

    <a class="brand" routerLink="/pedidos" aria-label="Ir para pedidos">
      <span class="brand-mark" aria-hidden="true">SP</span>
      <span>
        <strong>Stefanini</strong>
        <small>Gestão de pedidos</small>
      </span>
    </a>

    <nav aria-label="Navegação principal">
      <a

  <footer>
