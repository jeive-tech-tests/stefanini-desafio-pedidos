name: Integração contínua

on:
  push:
    branches: [main, developer]
  pull_request:
    branches: [main, developer]

permissions:
  contents: read

jobs:
  backend:
    name: Backend .NET
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v6

      - name: Configurar .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependências
        run: dotnet restore Stefanini.Pedidos.sln

      - name: Compilar
        run: dotnet build Stefanini.Pedidos.sln --configuration Release --no-restore

      - name: Executar testes com cobertura
        run: dotnet test Stefanini.Pedidos.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --settings coverlet.runsettings

      - name: Auditar pacotes vulneráveis
        run: dotnet list Stefanini.Pedidos.sln package --vulnerable --include-transitive

  frontend:
    name: Frontend Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Stefanini.Pedidos.Webapp
    steps:
      - name: Obter código
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Stefanini.Pedidos.Webapp/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar formatação
        run: npm run format:check

      - name: Executar testes com cobertura
        run: npm run test:coverage

      - name: Compilar
        run: npm run build

      - name: Auditar pacotes vulneráveis
        run: npm audit --audit-level=high
