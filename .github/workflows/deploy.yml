name: Deploy em produção

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: producao
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar aplicação
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, deploy]
    timeout-minutes: 30

    steps:
      - name: Obter código da main
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Preparar configuração protegida
        shell: bash
        env:
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        run: |
          if [ -z "$MSSQL_SA_PASSWORD" ]; then
            echo "O secret MSSQL_SA_PASSWORD não foi configurado."
            exit 1
          fi

          umask 077
          printf 'MSSQL_SA_PASSWORD=%s\n' "$MSSQL_SA_PASSWORD" > .env

      - name: Validar Docker Compose
        run: docker compose config --quiet

      - name: Construir e publicar containers
        run: docker compose up --detach --build --remove-orphans

      - name: Verificar aplicação
        shell: bash
        run: |
          for tentativa in $(seq 1 36); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health; then
              echo
              echo "Aplicação publicada e saudável."
              exit 0
            fi

            echo "Aguardando a aplicação ficar saudável ($tentativa/36)..."
            sleep 5
          done

          docker compose logs --tail=150 app sqlserver
          exit 1

      - name: Exibir estado dos serviços
        run: docker compose ps

      - name: Remover arquivo temporário de segredo
        if: always()
        run: rm -f .env

  release:
    name: Publicar versão
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Obter código publicado
        uses: actions/checkout@v6

      - name: Definir versão
        id: versao
        shell: bash
        run: echo "numero=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Empacotar código da versão
        id: pacote
        shell: bash
        env:
          VERSAO: ${{ steps.versao.outputs.numero }}
        run: |
          NOME="stefanini-desafio-pedidos-${VERSAO}.zip"
          mkdir -p dist
          git archive \
            --format=zip \
            --prefix="stefanini-desafio-pedidos-${VERSAO}/" \
            --output="dist/${NOME}" \
            "${GITHUB_SHA}"

          (
            cd dist
            sha256sum "${NOME}" > "${NOME}.sha256"
          )

          echo "arquivo=dist/${NOME}" >> "$GITHUB_OUTPUT"

      - name: Criar GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ steps.versao.outputs.numero }}
          PACOTE: ${{ steps.pacote.outputs.arquivo }}
        run: |
          TAG="v${VERSAO}"

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "A release ${TAG} já existe; nenhuma duplicação será criada."
            exit 0
          fi

          gh release create "${TAG}" \
            "${PACOTE}" \
            "${PACOTE}.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Versão ${VERSAO}" \
            --generate-notes \
            --latest \
            --notes "Deploy validado em https://jeive.dev/stefanini-desafio-pedidos/."
